<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="55%" stop-color="#D4BD85"/>
      <stop offset="100%" stop-color="#B89A55"/>
    </linearGradient>
    <linearGradient id="kGoldA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4BD85"/>
      <stop offset="100%" stop-color="#B89A55"/>
    </linearGradient>
    <linearGradient id="kGoldB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B89A55"/>
      <stop offset="100%" stop-color="#8A7038"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#B89A55" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#B89A55" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="900" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="260" fill="url(#bgGrad)"/>

    <circle cx="150" cy="60" r="130" fill="url(#glow)">
      <animate attributeName="cx" values="150;750;150" dur="16s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="200" r="150" fill="url(#glow)">
      <animate attributeName="cx" values="700;120;700" dur="20s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#B89A55" stroke-opacity="0.12" stroke-width="1">
      <line x1="0" y1="42" x2="900" y2="42"/>
      <line x1="0" y1="218" x2="900" y2="218"/>
    </g>

    <g opacity="0.6">
      <circle cx="60" cy="42" r="2" fill="#D4BD85"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="840" cy="52" r="2.3" fill="#B89A55"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="215" r="2" fill="#D4BD85"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="212" r="1.8" fill="#B89A55"><animate attributeName="opacity" values="1;0.3;1" dur="3.6s" repeatCount="indefinite"/></circle>
    </g>

    <!-- Kaisei credential pill -->
    <g transform="translate(360,18)">
      <rect width="180" height="26" rx="13" fill="#141414" stroke="#B89A55" stroke-opacity="0.55"/>
      <g transform="translate(9,3) scale(0.074)">
        <path d="M3 70.5V3H70L3 70.5Z" fill="#B89A55"/>
        <path d="M182.5 3H118L3.5 120V184.5L182.5 3Z" fill="#B89A55"/>
        <path d="M76.5 136.5L106 106L182 184.5H124.5L76.5 136.5Z" fill="#B89A55"/>
      </g>
      <text x="28" y="17" font-family="'Segoe UI', Verdana, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5" fill="#D4BD85">Founder &amp; CEO, Kaisei</text>
    </g>

    <text x="450" y="140" font-family="'Segoe UI', Verdana, sans-serif" font-size="46" font-weight="700" text-anchor="middle" fill="url(#textGrad)">
      Prudhvi Raj
    </text>

    <g>
      <clipPath id="typeClip">
        <rect x="65" y="163" height="30" width="0">
          <animate attributeName="width" values="0;772;772;772;0" keyTimes="0;0.4;0.85;0.95;1" dur="9s" repeatCount="indefinite"/>
        </rect>
      </clipPath>
      <text x="450" y="185" font-family="'Consolas','Courier New',monospace" font-size="18" text-anchor="middle" fill="#c9c9c4" clip-path="url(#typeClip)">
        Building AI-powered products, automation systems &amp; modern web apps.
      </text>
      <rect y="163" width="3" height="24" fill="#B89A55">
        <animate attributeName="x" values="65;65;837;837;65" keyTimes="0;0.4;0.85;0.95;1" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" dur="0.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <rect x="1" y="1" width="898" height="258" rx="14" fill="none" stroke="#B89A55" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
