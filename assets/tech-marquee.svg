<svg width="900" height="80" viewBox="0 0 900 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1f1a0d"/>
    </linearGradient>
    <linearGradient id="fadeMask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="6%" stop-color="white" stop-opacity="1"/>
      <stop offset="94%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeFade"><rect width="900" height="80" fill="url(#fadeMask)"/></mask>

    <!-- icon symbols, drawn on a 28x28 grid -->
    <symbol id="ic-react" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="2.4" fill="#61dafb"/>
      <g fill="none" stroke="#61dafb" stroke-width="1.4">
        <ellipse cx="14" cy="14" rx="11" ry="4.4"/>
        <ellipse cx="14" cy="14" rx="11" ry="4.4" transform="rotate(60 14 14)"/>
        <ellipse cx="14" cy="14" rx="11" ry="4.4" transform="rotate(120 14 14)"/>
      </g>
    </symbol>

    <symbol id="ic-next" viewBox="0 0 28 28">
      <circle cx="14" cy="14" r="13" fill="#000000"/>
      <text x="10.5" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">N</text>
      <rect x="17.6" y="9" width="1.6" height="10" fill="#ffffff"/>
    </symbol>

    <symbol id="ic-ts" viewBox="0 0 28 28">
      <rect x="1" y="1" width="26" height="26" rx="5" fill="#3178c6"/>
      <text x="6" y="19" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">TS</text>
    </symbol>

    <symbol id="ic-python" viewBox="0 0 28 28">
      <path d="M14 2c-5 0-4.7 2.2-4.7 2.2v2.3h4.8v0.7H7.4S4 6.8 4 12s2.9 5.7 2.9 5.7h1.8v-2.4s-0.1-2.9 2.9-2.9h4.7s2.8 0 2.8-2.7V5S19.5 2 14 2z" fill="#3776ab"/>
      <path d="M14 26c5 0 4.7-2.2 4.7-2.2v-2.3h-4.8v-0.7h6.7s3.4 0.4 3.4-4.8-2.9-5.7-2.9-5.7h-1.8v2.4s0.1 2.9-2.9 2.9h-4.7s-2.8 0-2.8 2.7v4.6S8.5 26 14 26z" fill="#ffd43b"/>
      <circle cx="10.3" cy="4.9" r="0.9" fill="#fff"/>
      <circle cx="17.7" cy="23.1" r="0.9" fill="#fff"/>
    </symbol>

    <symbol id="ic-node" viewBox="0 0 28 28">
      <path d="M14 1.5 25.5 8v12L14 26.5 2.5 20V8Z" fill="none" stroke="#68a063" stroke-width="1.6"/>
      <text x="6.3" y="18.5" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#68a063">JS</text>
    </symbol>

    <symbol id="ic-tailwind" viewBox="0 0 28 28">
      <path d="M14 8c-3.1 0-5.1 1.6-6 4.7 1.2-1.6 2.6-2.2 4.2-1.8.9.2 1.6.9 2.3 1.7C15.7 14 17.1 15.5 20 15.5c3.1 0 5.1-1.6 6-4.7-1.2 1.6-2.6 2.2-4.2 1.8-0.9-.2-1.6-.9-2.3-1.7C18.3 9.5 16.9 8 14 8Z" fill="#38bdf8"/>
      <path d="M8 15.5c-3.1 0-5.1 1.6-6 4.7 1.2-1.6 2.6-2.2 4.2-1.8.9.2 1.6.9 2.3 1.7 1.2 1.4 2.6 2.9 5.5 2.9 3.1 0 5.1-1.6 6-4.7-1.2 1.6-2.6 2.2-4.2 1.8-0.9-.2-1.6-.9-2.3-1.7-1.2-1.4-2.6-2.9-5.5-2.9Z" fill="#38bdf8"/>
    </symbol>

    <symbol id="ic-mongo" viewBox="0 0 28 28">
      <path d="M14 2c3 4 6 8.6 6 13.2 0 4.6-2.6 7.7-6 9.3-3.4-1.6-6-4.7-6-9.3C8 10.6 11 6 14 2Z" fill="#47a248"/>
      <rect x="13.5" y="20.5" width="1" height="5.2" fill="#e8f5e9"/>
    </symbol>

    <symbol id="ic-firebase" viewBox="0 0 28 28">
      <path d="M7 22 9.8 3.4c.15-1 1.55-1.1 1.85-.15l2.2 7.1 1.9-3.6c.35-.65 1.3-.6 1.6.1L23 22Z" fill="#ffa000"/>
      <path d="M7 22 8.6 11.4c.1-.7 1-.9 1.4-.35l2.6 3.6Z" fill="#ff8f00"/>
      <path d="M23 22 14 8c-.35-.65 0-1 .5-1s.85.3 1 .6L23 22Z" fill="#ffca28"/>
      <path d="M7 22c2.2 1.5 5 2.6 7 2.6s4.8-1.1 7-2.6l-4-6.6-2 2.3-2-2.7Z" fill="#ff6f00"/>
    </symbol>
  </defs>

  <rect width="900" height="80" rx="12" fill="#0a0a0a"/>

  <g mask="url(#edgeFade)">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0,0" to="-870,0" dur="18s" repeatCount="indefinite"/>
      <g font-family="'Segoe UI', Verdana, sans-serif" font-size="14" font-weight="600">

        <!-- first pass -->
        <g transform="translate(20,21)">
          <rect width="96" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-react" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">React</text>
        </g>
        <g transform="translate(130,21)">
          <rect width="104" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.35"/>
          <use href="#ic-next" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Next.js</text>
        </g>
        <g transform="translate(248,21)">
          <rect width="128" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-ts" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">TypeScript</text>
        </g>
        <g transform="translate(390,21)">
          <rect width="112" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-python" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Python</text>
        </g>
        <g transform="translate(516,21)">
          <rect width="112" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-node" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Node.js</text>
        </g>
        <g transform="translate(642,21)">
          <rect width="122" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-tailwind" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Tailwind</text>
        </g>
        <g transform="translate(778,21)">
          <rect width="128" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-mongo" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">MongoDB</text>
        </g>
        <g transform="translate(920,21)">
          <rect width="116" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-firebase" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Firebase</text>
        </g>

        <!-- second pass, seamless loop (offset by total width of first pass ~ 870) -->
        <g transform="translate(890,21)">
          <rect width="96" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-react" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">React</text>
        </g>
        <g transform="translate(1000,21)">
          <rect width="104" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.35"/>
          <use href="#ic-next" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Next.js</text>
        </g>
        <g transform="translate(1118,21)">
          <rect width="128" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-ts" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">TypeScript</text>
        </g>
        <g transform="translate(1260,21)">
          <rect width="112" height="38" rx="19" fill="url(#pillGrad)" stroke="#B89A55" stroke-opacity="0.45"/>
          <use href="#ic-python" x="6" y="5" width="28" height="28"/>
          <text x="40" y="24" fill="#D4BD85">Python</text>
        </g>
      </g>
    </g>
  </g>
</svg>
